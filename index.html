<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СЕРЁГА И ОЛЯМБУС КАЗИК — Игровой портал</title>
    <style>
        :root {
            --bg-main: #090d11;
            --bg-sidebar: #0d1218;
            --bg-topbar: #0d1319;
            --bg-card: #121922;
            --border-color: #1c2633;
            --neon-green: #1ae83a;
            --neon-glow: rgba(26, 232, 58, 0.35);
            --text-main: #ffffff;
            --text-muted: #7d8b9e;
            --gold: #fbbf24;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Inter, Roboto, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ЛЕВАЯ ПАНЕЛЬ */
        .left-sidebar {
            width: 270px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 30;
        }

        .brand-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 6px 4px 22px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .brand-crown {
            font-size: 1.45rem;
            color: var(--neon-green);
            filter: drop-shadow(0 0 8px var(--neon-glow));
            line-height: 1;
            margin-bottom: 4px;
        }

        .brand-title-top {
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 0.8px;
            color: #ffffff;
            line-height: 1.15;
            text-transform: uppercase;
        }

        .brand-title-bottom {
            font-size: 1.65rem;
            font-weight: 950;
            font-style: italic;
            letter-spacing: 1px;
            color: var(--neon-green);
            text-shadow: 0 0 18px var(--neon-glow);
            line-height: 1.05;
            margin-top: 2px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .nav-item {
            position: relative;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 10px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            transition: all 0.2s ease;
            text-align: left;
        }

        .nav-item-left { display: flex; align-items: center; gap: 9px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nav-icon { font-size: 1.05rem; width: 18px; text-align: center; flex-shrink: 0; }
        .nav-item:hover { background: rgba(255, 255, 255, 0.04); color: #ffffff; }
        .nav-item.active {
            background: linear-gradient(90deg, rgba(26, 232, 58, 0.16) 0%, rgba(26, 232, 58, 0.03) 100%);
            border-color: rgba(26, 232, 58, 0.25);
            color: #ffffff;
        }
        .nav-item.active::before {
            content: '';
            position: absolute;
            left: -12px; top: 8px; bottom: 8px;
            width: 4px; border-radius: 0 4px 4px 0;
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
        }

        .nav-badge {
            font-size: 0.6rem; font-weight: 900; padding: 3px 5px; border-radius: 5px; text-transform: uppercase; flex-shrink: 0; white-space: nowrap;
        }
        .badge-vip { background: #f59e0b; color: #000; }
        .badge-pro { background: #1ae83a; color: #041307; }

        /* ПРОМОКОДЫ */
        .sidebar-promo {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        .promo-header {
            display: flex; align-items: center; gap: 7px; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; color: #ffffff; margin-bottom: 10px;
        }
        .promo-header span { color: var(--neon-green); }
        .promo-input-group { display: flex; gap: 6px; }
        .promo-input-group input {
            width: 100%; background: #131b24; border: 1px solid #233040; border-radius: 8px; padding: 9px 11px; color: #fff; font-size: 0.84rem; outline: none;
        }
        .promo-input-group button {
            background: var(--neon-green); color: #041307; border: none; border-radius: 8px; padding: 0 13px; font-weight: 900; cursor: pointer;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        .main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        .topbar {
            height: 68px; background: var(--bg-topbar); border-bottom: 1px solid var(--border-color);
            padding: 0 26px; display: flex; align-items: center; justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 25;
        }

        .search-box {
            display: flex; align-items: center; gap: 10px; background: #131b24; border: 1px solid #1e2936; border-radius: 10px; padding: 9px 14px; width: 300px;
        }
        .search-box input { background: transparent; border: none; color: #fff; font-size: 0.88rem; width: 100%; outline: none; }

        .topbar-right { display: flex; align-items: center; gap: 14px; }
        .online-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); }
        .online-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); }

        .balance-box {
            display: flex; align-items: center; gap: 10px; background: #131b24; border: 1px solid #222f3e; padding: 8px 16px; border-radius: 10px; font-weight: 800; font-size: 1rem; color: var(--gold);
        }

        .content-area {
            padding: 22px 26px 32px; max-width: 1240px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column;
        }

        /* БАННЕР */
        .hero-banner {
            position: relative; border-radius: 18px; overflow: hidden;
            background: radial-gradient(circle at 78% 45%, rgba(251, 191, 36, 0.28) 0%, transparent 45%),
                        radial-gradient(circle at 20% 50%, rgba(26, 232, 58, 0.22) 0%, transparent 55%),
                        linear-gradient(115deg, #0b1612 0%, #15120c 48%, #22140a 100%);
            border: 1px solid #26332c; padding: 34px 38px; display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 22px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
        }
        .hero-left { max-width: 600px; z-index: 2; }
        .hero-title { margin: 0; line-height: 0.95; font-weight: 950; font-style: italic; text-transform: uppercase; }
        .hero-title .line1 { display: block; font-size: 2.1rem; color: #ffffff; letter-spacing: 1px; }
        .hero-title .line2 { display: block; font-size: 2.5rem; color: var(--neon-green); text-shadow: 0 0 28px rgba(26, 232, 58, 0.45); margin-top: 6px; }
        .hero-subtitle { margin: 14px 0 22px; font-size: 0.95rem; font-weight: 800; text-transform: uppercase; color: var(--gold); text-shadow: 0 0 10px rgba(251, 191, 36, 0.3); }
        .hero-cta-btn {
            background: linear-gradient(90deg, #1ce83c, #49ff66); color: #041407; border: none; border-radius: 12px; padding: 14px 28px; font-size: 1rem; font-weight: 900; text-transform: uppercase; cursor: pointer; box-shadow: 0 0 25px rgba(26, 232, 58, 0.45); transition: 0.2s;
        }

        /* КАРТОЧКИ РЕЖИМОВ */
        .modes-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .mode-card {
            position: relative; border-radius: 16px; padding: 20px; min-height: 175px; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: 0.25s ease; border: 1.5px solid #2b3847; background: #121922;
        }
        .mode-card:hover { transform: translateY(-5px); border-color: var(--neon-green); }
        .mode-card-visual { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .mode-big-emoji { font-size: 2.8rem; }
        .mode-tag-pill { background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.14); padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; color: #e2e8f0; }
        .mode-card-footer { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
        .mode-card-title { font-size: 1.35rem; font-weight: 950; font-style: italic; text-transform: uppercase; color: #fff; }
        .mode-card-desc { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: #9aa7b8; margin-top: 5px; }
        .mode-arrow-btn { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.08); display: grid; place-items: center; color: #fff; font-weight: 900; flex-shrink: 0; }

        /* ИГРОВЫЕ ОКНА */
        .game-view { display: none; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 18px; padding: 26px; margin-bottom: 24px; position: relative; }
        .game-view.active { display: block; }
        .game-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .game-header h2 { margin: 0; color: var(--neon-green); text-transform: uppercase; }
        .btn-back { background: #18222f; border: 1px solid #283649; color: #fff; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 700; }

        .controls-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin-top: 20px; }
        .controls-bar input, .controls-bar select { background: #0d131a; border: 1px solid #283649; color: #fff; padding: 10px 14px; border-radius: 10px; font-weight: 700; text-align: center;
