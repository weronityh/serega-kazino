<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СЕРЁГА И ОЛЯМБУС КАЗИК — Игровой портал</title>
    <style>
        :root {
            --bg-main: #090d11;
            --bg-sidebar: #0d1218;
            --bg-topbar: #0d1319;
            --bg-card: #121922;
            --bg-card-hover: #18222e;
            --border-color: #1c2633;
            --neon-green: #1ae83a;
            --neon-green-dark: #10b92b;
            --neon-glow: rgba(26, 232, 58, 0.35);
            --text-main: #ffffff;
            --text-muted: #7d8b9e;
            --gold: #fbbf24;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Inter, Roboto, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ================= ЛЕВАЯ БОКОВАЯ ПАНЕЛЬ ================= */
        .left-sidebar {
            width: 240px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 30;
        }

        .brand-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 6px 8px 22px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .brand-crown {
            font-size: 1.45rem;
            color: var(--neon-green);
            filter: drop-shadow(0 0 8px var(--neon-glow));
            line-height: 1;
            margin-bottom: 4px;
        }

        .brand-title-top {
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 0.8px;
            color: #ffffff;
            line-height: 1.15;
            text-transform: uppercase;
        }

        .brand-title-bottom {
            font-size: 1.65rem;
            font-weight: 950;
            font-style: italic;
            letter-spacing: 1px;
            color: var(--neon-green);
            text-shadow: 0 0 18px var(--neon-glow);
            line-height: 1.05;
            margin-top: 2px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .nav-item {
            position: relative;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.94rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            text-align: left;
        }

        .nav-item-left {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .nav-icon {
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(26, 232, 58, 0.16) 0%, rgba(26, 232, 58, 0.03) 100%);
            border-color: rgba(26, 232, 58, 0.25);
            color: #ffffff;
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 8px;
            bottom: 8px;
            width: 4px;
            border-radius: 0 4px 4px 0;
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
        }

        .nav-item.active .nav-icon {
            color: var(--neon-green);
        }

        .nav-badge {
            font-size: 0.65rem;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-hot { background: #ef4444; color: #fff; }
        .badge-new { background: var(--neon-green); color: #051408; }
        .badge-vip { background: #f59e0b; color: #000; }

        /* Промокод внизу сайдбара (как на скриншоте) */
        .sidebar-promo {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .promo-header {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .promo-header span {
            color: var(--neon-green);
        }

        .promo-input-group {
            display: flex;
            gap: 6px;
        }

        .promo-input-group input {
            width: 100%;
            min-width: 0;
            background: #131b24;
            border: 1px solid #233040;
            border-radius: 8px;
            padding: 9px 11px;
            color: #fff;
            font-size: 0.84rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .promo-input-group input:focus {
            border-color: var(--neon-green);
        }

        .promo-input-group button {
            background: var(--neon-green);
            color: #041307;
            border: none;
            border-radius: 8px;
            padding: 0 13px;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 12px rgba(26, 232, 58, 0.3);
        }

        .promo-input-group button:hover
